name: Build Master DMG

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-dmg:
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      COLTIDE_COGNITO_DOMAIN: ${{ vars.COLTIDE_DEV_COGNITO_DOMAIN }}
      COLTIDE_COGNITO_CLIENT_ID: ${{ vars.COLTIDE_DEV_COGNITO_CLIENT_ID }}
      COLTIDE_AWS_REGION: ${{ vars.COLTIDE_DEV_AWS_REGION }}
      COLTIDE_API_ENDPOINT: ${{ vars.COLTIDE_DEV_API_ENDPOINT }}
      COLTIDE_VAULT_API_ENDPOINT: ${{ vars.COLTIDE_DEV_VAULT_API_ENDPOINT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install

      - name: Generate TypeScript bindings
        run: bun run gen:bindings

      - name: Typecheck frontend
        run: cd apps/desktop && bunx tsc --noEmit

      - name: Validate desktop auth config
        run: |
          test -n "$COLTIDE_COGNITO_DOMAIN" || {
            echo "Missing GitHub repository variable: COLTIDE_DEV_COGNITO_DOMAIN" >&2
            exit 1
          }
          test -n "$COLTIDE_COGNITO_CLIENT_ID" || {
            echo "Missing GitHub repository variable: COLTIDE_DEV_COGNITO_CLIENT_ID" >&2
            exit 1
          }
          test -n "$COLTIDE_AWS_REGION" || {
            echo "Missing GitHub repository variable: COLTIDE_DEV_AWS_REGION" >&2
            exit 1
          }
          test -n "$COLTIDE_API_ENDPOINT" || {
            echo "Missing GitHub repository variable: COLTIDE_DEV_API_ENDPOINT" >&2
            exit 1
          }
          test -n "$COLTIDE_VAULT_API_ENDPOINT" || {
            echo "Missing GitHub repository variable: COLTIDE_DEV_VAULT_API_ENDPOINT" >&2
            exit 1
          }

      - name: Build DMG
        run: |
          cd apps/desktop
          bunx tauri build \
            --target aarch64-apple-darwin \
            --bundles dmg \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: coltide-dmg-${{ github.sha }}
          path: |
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error
