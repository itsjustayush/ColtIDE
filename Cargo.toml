[workspace]
resolver = "2"
members = [
    "crates/colt-core",
    "crates/colt-fs",
    "apps/desktop/src-tauri"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Ayush Bhattacharya <ayush@coltanedb.io>", "ColtIDE Team"]

[workspace.dependencies]
colt-core = { path = "crates/colt-core" }
colt-fs = { path = "crates/colt-fs" }

# Async runtime
tokio = { version = "1.43", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Tauri 2
tauri = "2.2"
tauri-build = "2.0"

# Git
git2 = "0.20"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

uuid = { version = "1.11", features = ["v4", "serde"] }
dirs = "5.0"
portable-pty = "0.8"
